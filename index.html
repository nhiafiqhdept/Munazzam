    <script>
      // Filter benign Vite development websocket connection notices in sandboxed container preview
      (function() {
        var origError = console.error;
        var origWarn = console.warn;
        var origInfo = console.info;

        function isViteHmrMessage(arg) {
          if (!arg) return false;
          var str = typeof arg === 'string' ? arg : (arg.message || String(arg));
          return str.indexOf('[vite] failed to connect to websocket') !== -1 ||
                 str.indexOf('[vite] Direct websocket connection') !== -1 ||
                 str.indexOf('[vite] connecting...') !== -1 ||
                 str.indexOf('WebSocket (failing)') !== -1 ||
                 str.indexOf('vite-ping') !== -1;
        }

        console.error = function() {
          if (isViteHmrMessage(arguments[0])) return;
          return origError.apply(console, arguments);
        };
        console.warn = function() {
          if (isViteHmrMessage(arguments[0])) return;
          return origWarn.apply(console, arguments);
        };
        console.info = function() {
          if (isViteHmrMessage(arguments[0])) return;
          return origInfo.apply(console, arguments);
        };
      })();
    </script>
